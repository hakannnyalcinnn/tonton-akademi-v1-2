name: PRIZMA Match3 test release

on:
  push:
    branches: [prizma-release-v0.2.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prizma-test-release-v0.2.0
  cancel-in-progress: false

jobs:
  test-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRIZMA_TOOLS_DIR: /tmp/prizma-tools
      PRIZMA_ARTIFACT_COMMIT: 029712ecd31c3460cd00292165d244270ad69590
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test prerequisite if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          command -v java
          command -v keytool
      - name: Install verified Godot engine
        run: |
          python3 tools/ci_install_godot.py --tools-root "$PRIZMA_TOOLS_DIR"
          echo "$PRIZMA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - name: Install verified Android verification tools
        run: python3 tools/bootstrap_android.py --tools-root "$PRIZMA_TOOLS_DIR" --accept-sdk-license
      - name: Run all Match-3 source tests
        run: bash tools/test.sh
      - name: Retrieve exact tested APK without exposing signing key
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/prizma-apk-v0.2.0
          test "$(git rev-parse FETCH_HEAD)" = "$PRIZMA_ARTIFACT_COMMIT"
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-match3.apk" > build/prizma-match3.apk
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-match3.apk.sha256" > build/prizma-match3.apk.sha256
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-runtime.sha256" > build/prizma-runtime.sha256
      - name: Verify exact runtime source, APK bytes and signature
        run: |
          python3 tools/runtime_digest.py > build/current-runtime.sha256
          cmp build/current-runtime.sha256 build/prizma-runtime.sha256
          sha256sum --check build/prizma-match3.apk.sha256
          "$PRIZMA_TOOLS_DIR/android-sdk/build-tools/36.0.0/apksigner" verify --verbose build/prizma-match3.apk
      - name: Create source archive
        run: git archive --format=zip --output=build/prizma-source.zip HEAD
      - name: Publish Match-3 prerelease
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.0 \
            build/prizma-match3.apk \
            build/prizma-match3.apk.sha256 \
            build/prizma-runtime.sha256 \
            build/prizma-source.zip \
            --target "$GITHUB_SHA" \
            --title "PRİZMA 0.2.0 — Match-3 test sürümü" \
            --prerelease \
            --notes-file docs/RELEASE_v0.2.0.md
