name: PRIZMA v0.12.3 premium gameplay feedback test release

on:
  push:
    branches: [prizma-release-v0.12.3]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prizma-test-release-v0.12.3
  cancel-in-progress: true

jobs:
  test-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIZMA_TOOLS_DIR: /tmp/prizma-tools
      PRIZMA_ARTIFACT_COMMIT: 9cce7130e14f4947d836626074de7fd9a6d45b2e
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test prerequisite if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          command -v java
          command -v keytool
      - name: Install verified Godot engine
        run: |
          python3 tools/ci_install_godot.py --tools-root "$PRIZMA_TOOLS_DIR"
          echo "$PRIZMA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - name: Install verified Android verification tools
        run: |
          if [ -x "${ANDROID_HOME:-/missing}/build-tools/36.0.0/apksigner" ]; then
            mkdir -p "$PRIZMA_TOOLS_DIR"
            ln -s "$ANDROID_HOME" "$PRIZMA_TOOLS_DIR/android-sdk"
          else
            python3 tools/bootstrap_android.py --tools-root "$PRIZMA_TOOLS_DIR" --accept-sdk-license
          fi
      - name: Run release-critical acceptance once
        run: bash tools/test_release_acceptance.sh
      - name: Retrieve exact tested artifacts
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/prizma-apk-v0.12.3
          test "$(git rev-parse FETCH_HEAD)" = "$PRIZMA_ARTIFACT_COMMIT"
          mkdir -p build
          for file in prizma-v0.12.3.apk prizma-v0.12.3-dev.apk checksums.sha256 prizma-runtime.sha256 prizma-v0123-report.zip v0123-247-before.png v0123-247-after.png v0123-effect-double.png v0123-effect-bomb_normal.png v0123-effect-rockets.png v0123-effect-storm.png; do
            git show "$PRIZMA_ARTIFACT_COMMIT:$file" > "build/$file"
          done
      - name: Verify exact runtime, APK bytes and signatures
        run: |
          python3 tools/runtime_digest.py > build/current-runtime.sha256
          cmp build/current-runtime.sha256 build/prizma-runtime.sha256
          (cd build && sha256sum --check checksums.sha256)
          for apk in build/prizma-v0.12.3.apk build/prizma-v0.12.3-dev.apk; do
            "$PRIZMA_TOOLS_DIR/android-sdk/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > build/signing-certificate.txt
            python3 -c 'from pathlib import Path; assert "01bb7474354b56e234ce24df50fd2e1ef45c838111b364cd0b3894bf8bb8360a" in Path("build/signing-certificate.txt").read_text()'
          done
      - name: Publish normal and isolated developer prerelease
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.12.3 >/dev/null 2>&1; then
            mkdir -p build/published
            gh release download v0.12.3 --pattern checksums.sha256 --pattern prizma-runtime.sha256 --dir build/published
            cmp build/checksums.sha256 build/published/checksums.sha256
            cmp build/prizma-runtime.sha256 build/published/prizma-runtime.sha256
            echo "Existing release matches exact tested source and artifacts."
            exit 0
          fi
          gh release create v0.12.3 \
            build/prizma-v0.12.3.apk \
            build/prizma-v0.12.3-dev.apk \
            build/checksums.sha256 \
            build/prizma-runtime.sha256 \
            build/prizma-v0123-report.zip \
            build/v0123-247-before.png \
            build/v0123-247-after.png \
            build/v0123-effect-double.png \
            build/v0123-effect-bomb_normal.png \
            build/v0123-effect-rockets.png \
            build/v0123-effect-storm.png \
            --target "$GITHUB_SHA" \
            --title "PRİZMA v0.12.3 — Premium kristal geri bildirimi" \
            --prerelease \
            --notes-file docs/RELEASE_v0.12.3.md
