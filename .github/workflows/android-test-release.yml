name: PRIZMA gameplay 2.0 test release

on:
  push:
    branches: [prizma-release-v0.9.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prizma-test-release-v0.9.0
  cancel-in-progress: true

jobs:
  test-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIZMA_TOOLS_DIR: /tmp/prizma-tools
      PRIZMA_ARTIFACT_COMMIT: 2b5dc0a2a6423a125c4cf1a837f84c34d7761c1d
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test prerequisite if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          command -v java
          command -v keytool
      - name: Install verified Godot engine
        run: |
          python3 tools/ci_install_godot.py --tools-root "$PRIZMA_TOOLS_DIR"
          echo "$PRIZMA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - name: Install verified Android verification tools
        run: python3 tools/bootstrap_android.py --tools-root "$PRIZMA_TOOLS_DIR" --accept-sdk-license
      - name: Run all Match-3 source tests
        run: bash tools/test.sh
      - name: Retrieve exact tested APK without exposing signing key
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/prizma-apk-v0.9.0
          test "$(git rev-parse FETCH_HEAD)" = "$PRIZMA_ARTIFACT_COMMIT"
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-match3.apk" > build/prizma-match3.apk
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-match3.apk.sha256" > build/prizma-match3.apk.sha256
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-runtime.sha256" > build/prizma-runtime.sha256
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-gameplay2-report.zip" > build/prizma-gameplay2-report.zip
          git show "$PRIZMA_ARTIFACT_COMMIT:prizma-gameplay2.png" > build/prizma-gameplay2.png
      - name: Verify exact runtime source, APK bytes and signature
        run: |
          python3 tools/runtime_digest.py > build/current-runtime.sha256
          cmp build/current-runtime.sha256 build/prizma-runtime.sha256
          sha256sum --check build/prizma-match3.apk.sha256
          "$PRIZMA_TOOLS_DIR/android-sdk/build-tools/36.0.0/apksigner" verify --verbose build/prizma-match3.apk
          "$PRIZMA_TOOLS_DIR/android-sdk/build-tools/36.0.0/apksigner" verify --print-certs build/prizma-match3.apk > build/signing-certificate.txt
          python3 -c 'from pathlib import Path; assert "01bb7474354b56e234ce24df50fd2e1ef45c838111b364cd0b3894bf8bb8360a" in Path("build/signing-certificate.txt").read_text()'
      - name: Create source archive
        run: git archive --format=zip --output=build/prizma-source.zip HEAD
      - name: Publish Match-3 prerelease
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/prizma-match3.apk build/prizma-v0.9.0.apk
          sha256sum build/prizma-v0.9.0.apk > build/prizma-v0.9.0.apk.sha256
          if gh release view v0.9.0 >/dev/null 2>&1; then
            mkdir -p build/published
            gh release download v0.9.0 --pattern prizma-runtime.sha256 --pattern prizma-v0.9.0.apk --dir build/published
            cmp build/prizma-runtime.sha256 build/published/prizma-runtime.sha256
            python3 -c 'from pathlib import Path; import hashlib; assert hashlib.sha256(Path("build/published/prizma-v0.9.0.apk").read_bytes()).digest() == hashlib.sha256(Path("build/prizma-match3.apk").read_bytes()).digest()'
            echo "Existing prerelease matches the verified runtime and APK bytes."
            exit 0
          fi
          gh release create v0.9.0 \
            build/prizma-v0.9.0.apk \
            build/prizma-v0.9.0.apk.sha256 \
            build/prizma-runtime.sha256 \
            build/prizma-source.zip \
            build/prizma-gameplay2-report.zip \
            build/prizma-gameplay2.png \
            --target "$GITHUB_SHA" \
            --title "PRİZMA 0.9.0 — Oynanış 2.0 — Fırtına, Dalga ve yeni denge" \
            --prerelease \
            --notes-file docs/RELEASE_v0.9.0.md
