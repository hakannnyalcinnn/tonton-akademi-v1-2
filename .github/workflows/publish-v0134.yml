name: Publish PRIZMA living adventure maps build 23
on:
  push:
    branches: [prizma-map-top-inset-fix]
    paths: [.github/workflows/publish-v0134.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prizma-publish-v0134
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout tested runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact locally verified APKs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7504d7f44b766c24cc22ca054a9e553ca0f9e607
          path: release-artifacts
          persist-credentials: false
      - name: Verify runtime and exact artifact bytes without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/runtime_digest.py > current-runtime.sha256
          cmp current-runtime.sha256 release-artifacts/prizma-runtime.sha256
          (cd release-artifacts && sha256sum --check checksums.sha256)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for path in Path('release-artifacts').glob('*.apk'):
              with ZipFile(path) as apk:
                  assert apk.testzip() is None
                  assert 'lib/arm64-v8a/libgodot_android.so' in apk.namelist()
                  assert not any('planet_view' in name or 'garden-review-r3' in name or 'planet-review' in name for name in apk.namelist())
          print('PASS: exact locally signed/verified artifacts and unchanged runtime')
          PY
      - name: Publish new revision while preserving all earlier releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.13.4 >/dev/null 2>&1; then
            echo 'Revision already exists; refusing to overwrite any release assets.' >&2
            exit 1
          fi
          gh release create v0.13.4 \
            release-artifacts/prizma-v0.13.4.apk \
            release-artifacts/prizma-v0.13.4-dev.apk \
            release-artifacts/checksums.sha256 \
            release-artifacts/map-top-fixed-844.png \
            release-artifacts/map-top-fixed-1200.png \
            release-artifacts/map-top-before.png \
            release-artifacts/prizma-v0.13.4-gorseller.zip \
            release-artifacts/TEST_REPORT.md \
            --verify-tag --prerelease \
            --title 'PRİZMA v0.13.4 — Harita Üst Boşluk Düzeltmesi' \
            --notes-file release-artifacts/release-notes.md
