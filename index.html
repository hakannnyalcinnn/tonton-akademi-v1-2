<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonton Akademi v1.2 - Oynayarak öğren, öğrenerek büyü!</title>
  <style>
    body { margin: 0; font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(#b3e5fc, #fff); overflow: hidden; }
    header { background: #ffca28; color: #333; text-align: center; padding: 15px; font-size: 1.4rem; font-weight: bold; }
    .container { display: flex; height: calc(100vh - 60px); }
    .menu { width: 200px; background: #fff59d; display: flex; flex-direction: column; padding: 10px; }
    .menu button { margin: 5px 0; padding: 10px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .menu button:hover { background: #ffe082; }
    .active { background: #ffb300 !important; color: white; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .question { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
    .options { display: flex; gap: 15px; }
    .option { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; cursor: pointer; transition: 0.2s; }
    .option:hover { transform: scale(1.05); }
    #stars { position: absolute; top: 20px; right: 20px; font-size: 1.2rem; }
    @keyframes confetti { 0% {transform: translateY(0);} 100% {transform: translateY(100vh);} }
    .confetti { position: absolute; width: 10px; height: 10px; background: gold; animation: confetti 2s linear infinite; }
  </style>
</head>
<body>
  <header>🎓 Tonton Akademi – Oynayarak öğren, öğrenerek büyü!</header>
  <div class="container">
    <div class="menu" id="menu"></div>
    <div class="content">
      <div id="stars">⭐ 0</div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
    </div>
  </div>
  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2021/10/27/audio_40b234b9f6.mp3?filename=kids-happy-tune-110734.mp3"></audio>
  <script>
    const categories = {
      "Sanat ve Yaratıcılık": [
        {q:"Elmanın rengi hangisi?", o:["🟥", "🟩", "🟦"], a:1},
        {q:"Top yuvarlak mı kare mi?", o:["⚽", "⬛"], a:0},
        {q:"Makası ne için kullanıyoruz?", o:["✂️", "🍎", "🚗"], a:0}
      ],
      "Matematiksel Düşünme": [
        {q:"Hangisinde daha çok elma var?", o:["🍎🍎", "🍎🍎🍎"], a:1},
        {q:"Hangisi daha uzun: kalem mi fırça mı?", o:["✏️", "🖌️"], a:1},
        {q:"Bu iki bardaktan hangisinde daha az su var?", o:["🥛", "💧"], a:1}
      ]
    };

    const sounds = {
      correct: new Audio('https://cdn.pixabay.com/download/audio/2021/08/09/audio_f40d391d59.mp3?filename=correct-2-46134.mp3'),
      wrong: new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_d2d1f65b9c.mp3?filename=error-2-126514.mp3'),
      finish: new Audio('https://cdn.pixabay.com/download/audio/2022/03/09/audio_f8a2d1e451.mp3?filename=success-1-6297.mp3')
    };

    let currentCategory = null;
    let currentIndex = 0;
    let score = 0;

    const menu = document.getElementById('menu');
    const question = document.getElementById('question');
    const options = document.getElementById('options');
    const stars = document.getElementById('stars');
    const bgMusic = document.getElementById('bgMusic');

    function playMusic(){ bgMusic.volume = 0.2; bgMusic.play(); }

    function loadMenu(){
      for(let c in categories){
        const btn = document.createElement('button');
        btn.textContent = c;
        btn.onclick = ()=>startCategory(c, btn);
        menu.appendChild(btn);
      }
    }

    function startCategory(cat, btn){
      playMusic();
      document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      currentIndex = 0;
      score = 0;
      stars.textContent = '⭐ 0';
      loadQuestion();
    }

    function loadQuestion(){
      const q = categories[currentCategory][currentIndex];
      question.textContent = q.q;
      options.innerHTML = '';
      q.o.forEach((opt, i)=>{
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = ()=>checkAnswer(i);
        options.appendChild(div);
      });
    }

    function checkAnswer(i){
      const q = categories[currentCategory][currentIndex];
      if(i === q.a){
        score++;
        stars.textContent = '⭐ ' + score;
        sounds.correct.play();
        if(score % 5 === 0) createConfetti();
        nextQuestion();
      } else {
        sounds.wrong.play();
      }
    }

    function nextQuestion(){
      currentIndex++;
      if(currentIndex >= categories[currentCategory].length){
        sounds.finish.play();
        question.textContent = '🎉 Müthiş! Bugün çok güzel şeyler öğrendin!';
        options.innerHTML = '';
        return;
      }
      loadQuestion();
    }

    function createConfetti(){
      for(let i=0;i<20;i++){
        const c = document.createElement('div');
        c.className='confetti';
        c.style.left=Math.random()*100+'vw';
        c.style.background=['gold','orange','red','blue','green'][Math.floor(Math.random()*5)];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
      }
    }

    loadMenu();
  </script>
</body>
</html>
